[package]
name = "breezedesk-editor"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Visual editor for Breezedesk widgets"
build = "build.rs"

[dependencies]
# OpenGL (glow) instead of the default wgpu: a much smaller executable.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard", "links", "accesskit", "x11"] }
toml_edit = "0.22"
toml = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
rfd = "0.18"

[build-dependencies]
winresource = "0.1"
