name: Release

# Every push to main becomes a GitHub release. Installed copies of Plume
# check the latest release and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to pick the next version
      - id: pick
        run: scripts/next-version.sh >> "$GITHUB_OUTPUT"

  # Built with the Microsoft toolchain (MSVC) on Windows: antivirus programs
  # trust those executables more than MinGW cross-compiled ones.
  build:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Build
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: plume-exe
          path: target/release/plume.exe

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plume-exe
          path: build
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis zip
      - name: Package
        run: scripts/package.sh "${{ needs.version.outputs.version }}" build/plume.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Plume $VERSION" \
            --generate-notes
