name: CI

# Builds and tests the dev branch and pull requests. Nothing is released:
# the files are attached to the run as an artifact for testing.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      PLUME_DEV: "1" # dev builds never update themselves
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: plume-exe
          path: target/release/plume.exe

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plume-exe
          path: build
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis zip
      - name: Package
        run: scripts/package.sh "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" build/plume.exe
      - uses: actions/upload-artifact@v4
        with:
          name: plume-dev-${{ github.sha }}
          path: dist/
