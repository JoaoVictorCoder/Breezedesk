# Simple clock with a blurred background. Drag it with the mouse; right click = menu.
name = "clock"
x = 40
y = 40
width = 280
height = 120
update_ms = 1000

[background]
color = "#0E0F1480"
radius = 16
border = "#FFFFFF22"
blur = "blur"            # none | blur | acrylic

[[element]]
type = "text"
x = 140
y = 10
size = 56
align = "center"
text = "{time:%H:%M}"

[[element]]
type = "text"
x = 140
y = 82
size = 16
align = "center"
color = "#FFFFFFAA"
text = "{time('%A, %Y-%m-%d')}"
