# Processes using the most CPU, per-core usage and network latency.
name = "processes"
x = 340
y = 410
width = 320
height = 232
update_ms = 1000

[background]
color = "#0E0F14B0"
radius = 16
border = "#FFFFFF22"

[[element]]
type = "text"
x = 16
y = 10
size = 15
bold = true
text = "Top processes"

[[element]]
type = "text"
x = 304
y = 12
size = 12
align = "right"
color = "#FFFFFF88"
text = "CPU · memory"

[[element]]
type = "text"
x = 16
y = 38
size = 13
text = "{default(top_name(0), '')}"
wrap = 190
max_lines = 1

[[element]]
type = "text"
x = 304
y = 38
size = 13
align = "right"
color = "#FFFFFFAA"
text = "{is_null(top_cpu(0)) ? '' : top_cpu(0) + '%   ' + top_mem(0) + ' MB'}"

