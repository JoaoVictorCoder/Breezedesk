# Analog clock: the hands are rectangles rotated with expressions.
name = "analog-clock"
x = 340
y = 40
width = 200
height = 200
update_ms = 1000
hover_opacity = 255
opacity = 220

[background]
color = "#0E0F14C0"
radius = 100
border = "#FFFFFF30"
border_width = 2

[[element]]
type = "rect"
x = 98
y = 10
w = 4
h = 14
radius = 1
color = "#FFFFFFDD"
rotate = 0
rotate_center = [100, 100]

