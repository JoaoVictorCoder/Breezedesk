# Hour hand
[[element]]
type = "rect"
x = 97
y = 52
w = 6
h = 52
radius = 3
color = "#FFFFFF"
rotate = "hour12 * 30 + minute * 0.5"
rotate_center = [100, 100]

# Minute hand
[[element]]
type = "rect"
x = 98.5
y = 30
w = 3
h = 74
radius = 1.5
color = "#FFFFFFDD"
rotate = "minute * 6 + second * 0.1"
rotate_center = [100, 100]

